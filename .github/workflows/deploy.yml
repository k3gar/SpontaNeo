name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # Cambia a "master" si es el nombre de tu rama

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload
        uses: withastro/action@v3
        # Esta acción detecta automáticamente si usas npm, pnpm o yarn